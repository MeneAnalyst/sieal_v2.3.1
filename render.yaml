services:
  - type: web
    name: sieal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in the Render dashboard — never commit it
      - key: DATABASE_URL
        sync: false          # your Supabase connection string (OLTP)
      - key: WAREHOUSE_DATABASE_URL
        sync: false          # optional — separate Postgres for Population Analytics; leave unset to disable that feature gracefully
